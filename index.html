const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}


async function search(q){
  q=q.trim();if(!q)return;$('#q').value=q;
  const out=$('#out');
  if(!sample){out.innerHTML='<div class="card err">目前無法查詢，請在 Claude 中開啟此頁面。</div>';return}
  out.innerHTML='<div class="card mute">查詢中…</div>';$('#go').disabled=true;
  try{
    const res=await fetch('/api/lookup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q})});
    const r=await res.json().catch(()=>({}));
    if(!res.ok)throw {code:r.error,detail:r.detail||('HTTP '+res.status)};
    cur=(r&&r.entries)||[];
    if(!cur.length)throw new Error('empty');
    out.innerHTML=(r.input_lang?'<div class="mute" style="margin:0 4px 8px">偵測語言：'+esc(r.input_lang)+'</div>':'')+cur.map(entry).join('');
  }catch(e){
    out.innerHTML='<div class="card err">'+(e&&e.code==='rate_limited'?'查詢太頻繁，請稍後再試。':e&&e.code==='no_key'?'伺服器尚未設定 ANTHROPIC_API_KEY。':'查詢失敗'+(e&&e.detail?'（'+esc(e.detail)+'）':'')+'，請稍後再試或換個說法。')+'</div>';
  }
  $('#go').disabled=false;
}
function entry(e,i){
  const has=S.words.some(w=>w.word===e.word);
  return '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><span class="word">'+esc(e.word)+'</span><span class="rd">'+esc(e.reading)+'</span><div class="mute">'+esc(e.romaji)+'</div></div><div class="row"><button class="btn" data-act="say" data-i="'+i+'">🔊</button><button class="btn pri" data-act="add" data-i="'+i+'"'+(has?' disabled':'')+'>'+(has?'已加入':'＋單字本')+'</button></div></div>'
  +'<div style="margin-top:6px">'+(e.pos?'<span class="chip">'+esc(e.pos)+'</span>':'')+(e.jlpt&&e.jlpt!=='—'?'<span class="chip">JLPT '+esc(e.jlpt)+'</span>':'')+'</div>'
  +'<p style="margin:8px 0 4px;font-size:18px"><b>'+esc(e.meaning)+'</b></p><p style="margin:0 0 8px" class="mute">'+esc(e.explanation)+'</p>'
  +(e.examples||[]).map(x=>'<div class="ex"><div>'+esc(x.ja)+' <a href="#" data-act="sayx" data-t="'+esc(x.ja)+'" style="text-decoration:none">🔊</a></div><div class="mute">'+esc(x.reading)+'</div><div><b>'+esc(x.zh)+'</b></div></div>').join('')
  +((e.related||[]).length?'<div style="margin-top:6px"><span class="mute">相關：</span>'+e.related.map(r=>'<span class="chip go" data-q="'+esc(r)+'">'+esc(r)+'</span>').join('')+'</div>':'')+'</div>';
}
function addWord(e){
  if(S.words.some(w=>w.word===e.word))return;
  S.words.unshift({id:Date.now(),word:e.word,reading:e.reading,meaning:e.meaning,pos:e.pos,jlpt:e.jlpt,date:today(),known:false,seen:0,last:0});
  S.log[today()]=(S.log[today()]||0)+1;save();upd();
}

function calc(){
  const g=S.goal;if(!g)return null;const t=today();
  const done=S.log[t]||0,total=S.words.length;
  const days=Math.max(1,Math.round((new Date(g.deadline+'T00:00')-new Date(t+'T00:00'))/864e5)+1);
  const rem0=Math.max(0,g.target-(total-done));
  return{done,total,days,daily:Math.max(1,Math.ceil(rem0/days)),target:g.target};
}
function streak(){let n=0,d=new Date();if(!(S.log[fmt(d)]>0))d.setDate(d.getDate()-1);while(S.log[fmt(d)]>0){n++;d.setDate(d.getDate()-1)}return n}
function upd(){
  const c=calc();$('#chip').textContent=c?'今日 '+c.done+' / '+c.daily+' 字':'尚未設定目標';
  renderProg();renderBook();side();
}
function renderProg(){
  const c=calc(),el=$('#prog');
  if(!c){el.innerHTML='<div class="card mute">設定目標後，這裡會顯示每日進度、連續天數與最近 7 天紀錄。</div>';return}
  const R=52,C=2*Math.PI*R,p=Math.min(1,c.done/c.daily),tp=Math.min(100,Math.round(c.total/c.target*100));
  const wd=['日','一','二','三','四','五','六'],days=[];let mx=c.daily;
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const n=S.log[fmt(d)]||0;mx=Math.max(mx,n);days.push([wd[d.getDay()],n])}
  el.innerHTML='<div class="card"><div class="row" style="gap:18px"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="var(--chip)" stroke-width="12"/><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C*p+' '+C+'" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">'+c.done+'/'+c.daily+'</text><text x="65" y="84" text-anchor="middle" font-size="12" fill="var(--mute)">今日單字</text></svg>'
  +'<div style="flex:1;min-width:180px"><div class="mute">'+(c.done>=c.daily?'🎉 今日目標達成！':'再學 <b>'+(c.daily-c.done)+'</b> 個字就達標')+'</div><div class="mute" style="margin:10px 0 4px">總進度 '+c.total+' / '+c.target+'（'+tp+'%）</div><div class="bar"><i style="width:'+tp+'%"></i></div></div></div></div>'
  +'<div class="grid" style="margin-bottom:12px"><div class="stat"><b>'+streak()+' 天</b><span class="mute">連續學習</span></div><div class="stat"><b>'+c.days+' 天</b><span class="mute">距離完成日</span></div><div class="stat"><b>'+S.words.filter(w=>w.known).length+'</b><span class="mute">已記住單字</span></div><div class="stat"><b>'+(S.rev[today()]||0)+'</b><span class="mute">今日複習張數</span></div><div class="stat"><b>'+(S.qn||0)+'</b><span class="mute">完成小考次數</span></div><div class="stat"><b>'+Math.max(0,...Object.values(S.best||{}))+'/10</b><span class="mute">小考最高分</span></div></div>'
  +'<div class="card"><b>最近 7 天</b><div class="week">'+days.map(d=>'<div><span>'+d[1]+'</span><i style="height:'+Math.round(d[1]/mx*60)+'px"></i>'+d[0]+'</div>').join('')+'</div></div>';
}
function renderBook(){
  $('#bc').textContent='共 '+S.words.length+' 個單字，'+S.words.filter(w=>!w.known).length+' 個待複習';
  $('#list').innerHTML=S.words.length?S.words.map(w=>'<div class="item"><div class="m"><b style="font-size:18px">'+esc(w.word)+'</b> <span style="color:var(--ac)">'+esc(w.reading)+'</span><div class="mute">'+esc(w.meaning)+'</div></div><button class="btn" data-act="say2" data-id="'+w.id+'">🔊</button><button class="btn" data-act="known" data-id="'+w.id+'">'+(w.known?'✅':'☐')+'</button><button class="btn" data-act="del" data-id="'+w.id+'">✕</button></div>').join(''):'<div class="mute">還沒有單字。到「查詞」加入你的第一個字吧。</div>';

function renderRev(){
  const el=$('#rev');
  if(qi>=queue.length){el.innerHTML='<div class="card flash"><b>'+(queue.length?'複習完成 🎉':'沒有需要複習的單字')+'</b></div>';return}
  const w=queue[qi];
  el.innerHTML='<div class="card flash"><div class="mute">'+(qi+1)+' / '+queue.length+'</div><div class="word" style="margin:10px 0">'+esc(w.word)+'</div>'+(shown?'<div class="rd" style="margin:0">'+esc(w.reading)+'</div><p><b style="font-size:18px">'+esc(w.meaning)+'</b></p><div class="row" style="justify-content:center"><button class="btn" data-act="miss">還不熟</button><button class="btn pri" data-act="hit">記得</button></div>':'<button class="btn pri" data-act="show">顯示答案</button>')+'</div>';
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],[data-q],[data-tab]');if(!t)return;
  if(t.dataset.q){ev.preventDefault();show('search');search(t.dataset.q);return}
  if(t.dataset.tab){show(t.dataset.tab);return}
  const a=t.dataset.act,id=+t.dataset.id,w=S.words.find(x=>x.id===id);
  if(a==='say')speak(cur[+t.dataset.i].word);
  else if(a==='sayx'){ev.preventDefault();speak(t.dataset.t)}
  else if(a==='add'){addWord(cur[+t.dataset.i]);say('加入單字本囉！','hop');t.disabled=true;t.textContent='已加入'}
  else if(a==='say2'&&w)speak(w.word);
  else if(a==='known'&&w){w.known=!w.known;save();upd()}
  else if(a==='del'&&w){S.words=S.words.filter(x=>x.id!==id);save();upd()}
  else if(a==='show'){shown=true;renderRev()}
  else if(a==='hit'||a==='miss'){const w=queue[qi];w.last=Date.now();w.seen=a==='hit'?(w.seen||0)+1:0;if(w.seen>=3)w.known=true;S.rev[today()]=(S.rev[today()]||0)+1;save();qi++;shown=false;renderRev();upd()}
});

const TIPS=['「は」當助詞時讀作 wa，「へ」當助詞時讀作 e。','數字 4 和 7 常念 yon、nana，避開不吉利的 shi、shichi。','「です、ます」是禮貌體，對長輩或初次見面的人使用。','長音要念滿兩拍：「おばさん」是阿姨，「おばあさん」是奶奶。','促音「っ」要停一拍：「きて」和「きって」意思不同。','日文量詞很多：人（にん）、本（ほん）、枚（まい）。','漢字有音讀和訓讀，例如「山」音讀 さん、訓讀 やま。','「ありがとう」更禮貌的說法是「ありがとうございます」。'];
let ll=0,rl=-1,rc=null;
function qTimer(){
  clearInterval(qiv);Q.end=Date.now()+Q.T*1000;
  qiv=setInterval(()=>{
    if(!Q.on||Q.lock){clearInterval(qiv);return}
    const l=Q.end-Date.now(),i=$('#tbi');if(!i)return;
    i.style.width=Math.max(0,l/(Q.T*1000)*100)+'%';i.style.background=l<3000?'var(--ac)':'var(--ok)';$('#tn').textContent='⏱ '+Math.max(0,Math.ceil(l/1000));
    if(l<=0){clearInterval(qiv);qAns(-1,null)}
  },100);
}
function libRender(){
  const L=VB[ll];
  $('#lib').innerHTML='<div class="card"><div class="row">'+LV.map((n,i)=>'<button class="btn'+(i===ll?' pri':'')+'" data-ll="'+i+'">'+n+'</button>').join('')+'</div><div class="row" style="margin-top:10px;justify-content:space-between"><span class="mute">'+LV[ll]+' 單字庫・共 '+L.length+' 個單字</span><button class="btn pri" data-lq="1">用 '+LV[ll]+' 開始小考</button></div></div><div class="card">'+L.map((w,i)=>'<div class="item"><div class="m"><b style="font-size:18px">'+esc(w.word)+'</b> <span style="color:var(--ac)">'+esc(w.reading)+'</span><div class="mute">'+esc(w.meaning)+'</div></div><button class="btn" data-ls="'+i+'">🔊</button><button class="btn" data-lw="'+i+'"'+(S.words.some(x=>x.word===w.word)?' disabled>✓':'>＋')+'</button></div>').join('')+'</div>';
}
function rnd1(){
  const a=rl<0?VB.map((L,i)=>L.map(w=>({...w,lv:LV[i]}))).flat():VB[rl].map(w=>({...w,lv:LV[rl]}));let w;
  do{w=rnd(a)}while(a.length>1&&rc&&w.word===rc.word);rc=w;rwr();
}
function rwr(){
  const w=rc,has=S.words.some(x=>x.word===w.word);
  document.querySelectorAll('.rw').forEach(e=>e.innerHTML='<div class="row" style="justify-content:space-between"><b>🎲 隨機單字</b><span class="chip">'+w.lv+'</span></div><div class="row" style="margin:8px 0">'+['全部',...LV].map((n,i)=>'<span class="chip go'+(i-1===rl?' on':'')+'" data-rl="'+(i-1)+'">'+n+'</span>').join('')+'</div><div style="text-align:center;padding:6px 0"><div class="word">'+esc(w.word)+'</div><div class="rd" style="margin:0">'+esc(w.reading)+'</div><p style="margin:6px 0"><b>'+esc(w.meaning)+'</b></p></div><div class="row" style="justify-content:center"><button class="btn" data-rs="1">🔊</button><button class="btn pri" data-ra="1"'+(has?' disabled>已加入':'>＋單字本')+'</button><button class="btn" data-rn="1">換一個 🎲</button></div>');
}
function side(){
  const c=calc(),B=S.best,L={h:'平假名',k:'片假名',l:'聽音辨字',w:'單字本'};
  $('#sl-p').innerHTML='<b>📅 今日學習</b>'+(c?'<div class="bar" style="margin:10px 0 6px"><i style="width:'+Math.min(100,c.done/c.daily*100)+'%"></i></div><div class="mute">'+c.done+' / '+c.daily+' 字・連續 '+streak()+' 天</div>':'<div class="mute" style="margin:6px 0">尚未設定學習目標</div><button class="btn" data-tab="goal">去設定</button>');
  $('#sl-t').innerHTML='<b>💡 日語小知識</b><p class="mute" style="margin:8px 0 0">'+TIPS[Math.floor(Date.now()/864e5)%TIPS.length]+'</p>';
  const rows=Object.keys(B).map(k=>[L[k]||(/^v\d-\d$/.test(k)?LV[k[1]]+' '+DN[k[3]]:null),B[k]]).filter(r=>r[0]);
  $('#sr-s').innerHTML='<b>🏆 小考最高分</b>'+(rows.length?rows.map(r=>'<div class="row" style="justify-content:space-between;margin-top:6px"><span class="mute">'+r[0]+'</span><b>'+r[1]+'/10</b></div>').join(''):'<div class="mute" style="margin-top:6px">還沒有紀錄，去挑戰看看！</div>');
}
function petals(){
  const b=document.querySelector('.bg');
  for(let i=0;i<12;i++){const e=document.createElement('div');e.className='pt';e.textContent='🌸';e.style.cssText='left:'+Math.random()*100+'%;font-size:'+(12+Math.random()*14)+'px;animation-duration:'+(11+Math.random()*10)+'s;animation-delay:-'+Math.random()*18+'s';b.appendChild(e)}
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-ql],[data-ll],[data-ls],[data-lw],[data-lq],[data-rl],[data-rn],[data-rs],[data-ra]');if(!t)return;const D=t.dataset;
  if(D.ql!==undefined){lv=+D.ql;qMenu()}
  else if(D.ll!==undefined){ll=+D.ll;libRender()}
  else if(D.ls!==undefined)speak(VB[ll][+D.ls].word);
  else if(D.lw!==undefined){addWord({...VB[ll][+D.lw],pos:'',jlpt:LV[ll]});say('加入單字本囉！','hop');libRender();rwr()}
  else if(D.lq!==undefined){lv=ll;show('quiz');qMenu()}
  else if(D.rl!==undefined){rl=+D.rl;rnd1()}
  else if(D.rn!==undefined)rnd1();
  else if(D.rs!==undefined)speak(rc.word);
  else if(D.ra!==undefined){addWord({...rc,pos:'',jlpt:rc.lv});say('加入單字本囉！','hop');rwr()}
});
function qMenu(){
  Q={on:false};clearInterval(qiv);const w=S.words.length>=4,bk='v'+lv+'-'+qd;
  const m=(k,ic,t,d,off)=>'<button class="card k" style="aspect-ratio:auto;align-items:flex-start;text-align:left;width:100%;padding:16px;'+(off?'opacity:.5':'')+'" data-qm="'+k+'"'+(off?' disabled':'')+'><b style="font-size:20px">'+ic+' '+t+'</b><small style="font-size:13px">'+d+(S.best[k]!=null?'・最高 '+S.best[k]+'/10':'')+'</small></button>';
  $('#qa').innerHTML='<div class="card"><b>📚 詞彙測驗</b><div class="mute" style="margin:8px 0 4px">單字庫等級</div><div class="row">'+LV.map((n,i)=>'<button class="btn'+(i===lv?' pri':'')+'" data-ql="'+i+'">'+n+'</button>').join('')+'</div><div class="mute" style="margin:10px 0 4px">難度（限時作答）</div><div class="row">'+DN.map((n,i)=>'<button class="btn'+(i===qd?' pri':'')+'" data-qd="'+i+'">'+n+'・'+TL[i]+' 秒</button>').join('')+'</div><div class="mute" style="margin-top:8px">'+['附讀音，看日文選中文','不附讀音，看日文選中文','看中文選日文'][qd]+'</div><button class="btn pri" style="margin-top:10px" data-qm="v">開始 10 題'+(S.best[bk]!=null?'・最高 '+S.best[bk]+'/10':'')+'</button></div><div class="mute" style="margin:6px 4px 10px">五十音與單字本（每題限時 10～12 秒）</div><div class="grid">'+m('h','あ','平假名','看字選羅馬拼音')+m('k','ア','片假名','看字選羅馬拼音')+m('l','🔊','聽音辨字','聽發音選出假名')+m('w','📖','單字本測驗',w?'看日文選中文意思':'單字本需至少 4 個單字',!w)+'</div>';
}
function qStart(m){
  let qs,bk=m;
  if(m==='v'||m==='w'){
    const P=m==='v'?VB[lv]:S.words,rev=m==='v'&&qd===2,key=rev?'word':'meaning';bk=m==='v'?'v'+lv+'-'+qd:m;
    qs=sh(P).slice(0,10).map(w=>{
      const o=sh([w,...sh(P.filter(y=>y[key]!==w[key])).slice(0,3)]),rd=x=>x.reading?'（'+x.reading+'）':'';
      return{h:rev?'「'+w.meaning+'」的日文':w.word+rd(w),t:rev?w.meaning:w.word,s:(m==='w'||qd===0)?w.reading:'',a:w[key],o:o.map(x=>x[key]),w:m==='v'?w:null,
        x:Object.fromEntries(o.map(x=>[x[key],rev?'「'+x.word+'」'+rd(x)+'意思是「'+x.meaning+'」':'「'+x.word+'」'+rd(x)+'的意思是「'+x.meaning+'」']))};
    });
  }else{
    const P=kana(m==='k'?'k':'h'),rs=[...new Set(P.map(x=>x.r))],cOf=r=>P.find(x=>x.r===r).c;
    qs=sh(P).slice(0,10).map(x=>{
      if(m==='l'){const o=sh([x.c,...sh(P.filter(y=>y.r!==x.r)).slice(0,3).map(y=>y.c)]);return{h:'聽到「'+x.r+'」',say:x.c,a:x.c,o,x:Object.fromEntries(o.map(c=>[c,'「'+c+'」讀作 '+P.find(y=>y.c===c).r]))}}
      const o=sh([x.r,...sh(rs.filter(r=>r!==x.r)).slice(0,3)]);
      return{h:'「'+x.c+'」怎麼念',t:x.c,a:x.r,o,x:Object.fromEntries(o.map(r=>[r,r===x.r?'「'+x.c+'」讀作 '+r:r+' 是「'+cOf(r)+'」的讀音']))};
    });
  }
  Q={on:true,m,bk,qs,i:0,sc:0,lock:false,wr:[],T:m==='v'?TL[qd]:m==='w'?12:10};qShow();
}
function qShow(){
  const q=Q.qs[Q.i];if(!q)return qEnd();
  $('#qa').innerHTML='<div class="bar" style="margin-bottom:12px"><i style="width:'+Q.i/Q.qs.length*100+'%"></i></div><div class="card" style="text-align:center"><div class="mute">第 '+(Q.i+1)+' / '+Q.qs.length+' 題・得分 '+Q.sc+'<span id="tn" style="float:right">⏱ '+Q.T+'</span></div><div class="tb"><i id="tbi" style="width:100%"></i></div>'+(q.say?'<button class="btn" style="font-size:40px;margin:8px 0" id="rp">🔊</button>':'<div class="big" style="margin:8px 0;'+(q.t.length>6?'font-size:30px':'')+'">'+esc(q.t)+'</div>')+(q.s?'<div class="rd" style="margin:0">'+esc(q.s)+'</div>':'')+'<div class="opts">'+q.o.map((o,i)=>'<button class="btn opt" data-o="'+i+'">'+esc(o)+'</button>').join('')+'</div></div><button class="btn" data-qx="1">結束小考</button>';
  if(q.say){speak(q.say);$('#rp').onclick=()=>speak(q.say)}
  qTimer();
}
function qAns(i,b){
  if(Q.lock)return;Q.lock=true;const q=Q.qs[Q.i],ok=q.o[i]===q.a;
  clearInterval(qiv);if(b)b.classList.add(ok?'ok':'no');if(!ok)document.querySelectorAll('.opt')[q.o.indexOf(q.a)].classList.add('ok');
  if(ok){Q.sc++;say(rnd(['答對了！','太棒了！','你好厲害！']),'hop')}else{Q.wr.push({q,p:q.o[i]});say(rnd(['沒關係，看看正解～','下次一定會！']),'sad')}
  setTimeout(()=>{if(!Q.on)return;Q.i++;Q.lock=false;qShow()},ok?800:1500);
}
function qEnd(){
  const n=Q.qs.length,s=Q.sc,bk=Q.bk;if(S.best[bk]==null||s>S.best[bk])S.best[bk]=s;S.qn=(S.qn||0)+1;save();upd();
  $('#qa').innerHTML='<div class="card" style="text-align:center"><div class="big">'+(s>=n*.9?'🏆':s>=n*.6?'🎉':'💪')+'</div><div class="word">'+s+' / '+n+'</div><p class="mute">'+(s>=n*.9?'太厲害了！':s>=n*.6?'不錯喔，再練習一下會更穩。':'多練習幾次一定會進步！')+'</p><div class="row" style="justify-content:center"><button class="btn pri" data-qm="'+Q.m+'">再來一次</button><button class="btn" data-qx="1">回選單</button></div></div>'
  +(Q.wr.length?'<div class="card"><b>📝 錯誤解析（'+Q.wr.length+' 題）</b>'+Q.wr.map((e,i)=>'<div class="ex"><div><b>'+esc(e.q.h)+'</b> '+(e.q.w?'<button class="btn" data-aw="'+i+'">＋單字本</button>':'')+'</div><div class="err">✗ '+(e.p==null?'時間到，沒有作答':'你選：'+esc(e.p)+'　→　'+esc(e.q.x[e.p]))+'</div><div style="color:var(--ok)">✓ 正解：'+esc(e.q.a)+'　→　'+esc(e.q.x[e.q.a])+'</div></div>').join('')+'</div>':'<div class="card mute" style="text-align:center">全部答對，沒有需要解析的題目 🎉</div>');
  say(s>=n*.9?'滿分級的表現，'+snd():s>=n*.6?'不錯喔！看看錯誤解析吧':'看解析再試一次，我陪你','hop');
  if(s>=n*.8)for(let i=0;i<28;i++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','✨','🌸','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-k],[data-ks],[data-kd],[data-qm],[data-o],[data-qx],[data-qd],[data-aw],[data-cat],[data-pet],[data-sp]');if(!t)return;const D=t.dataset;
  if(D.ks){ks=D.ks;kRender()}
  else if(D.kd!==undefined){kdk=+D.kd;kRender()}
  else if(D.k){document.querySelectorAll('.k.on').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#kb').textContent=D.k;$('#kr').textContent=D.r;speak(D.k)}
  else if(D.qm)qStart(D.qm);
  else if(D.o!==undefined)qAns(+D.o,t);
  else if(D.qx)qMenu();
  else if(D.qd!==undefined){qd=+D.qd;qMenu()}
  else if(D.aw!==undefined){const w=Q.wr[+D.aw].q.w;addWord({word:w.word,reading:w.reading,meaning:w.meaning,pos:'',jlpt:LV[lv]});t.disabled=true;t.textContent='已加入';say('加入單字本囉！','hop')}
  else if(D.cat)setCat(D.cat,1);
  else if(D.sp)setPet(D.sp,1);
  else if(D.pet){stopCat();say(rnd([snd(),'好舒服～','今天也一起加油！','摸摸我，我就有精神了']),'hop')}
});
(function init(){kRender();wod();rnd1();petals();setCat(S.cat||'o');setPet(S.pet||'c');startRoam();say('嗨！我是你的陪讀'+(S.pet==='d'?'小狗':'貓咪')+'，一起學日文吧～','hop');setInterval(()=>{if(!Q.on)say(rnd(['喝口水休息一下吧～','每天一點點，進步看得見！','記得複習昨天的單字喔',snd()]))},45000);
  const g=S.goal,d=new Date();d.setDate(d.getDate()+90);
  $('#tg').value=g?g.target:3750;$('#dl').value=g?g.deadline:fmt(d);
  if(g)$('#lv').value=[...$('#lv').options].some(o=>o.value==g.level)?g.level:'0';
  upd();
})();
</script></body></html>
